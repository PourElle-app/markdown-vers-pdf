<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Convertir Markdown en PDF en Ligne (Gratuit)</title>
<style>
:root{--ink:#17233b;--muted:#66758b;--blue:#5b5ce2;--line:#e5e9f2;}
body{margin:0;font:14px/1.5 Inter,sans-serif;color:var(--ink);background:#fff;}
.top{display:flex;justify-content:space-between;padding:15px 30px;border-bottom:1px solid var(--line);}
.brand{font-weight:850;font-size:20px;display:flex;gap:10px;align-items:center;}
.brandmark{width:32px;height:32px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;}
.container{max-width:800px;margin:30px auto;padding:20px;text-align:center;}
textarea{width:100%;height:200px;padding:10px;border:1px solid #ccc;border-radius:8px;font:inherit;margin-bottom:15px;resize:vertical;}
.primary{background:var(--blue);color:#fff;padding:14px;border:0;border-radius:10px;font-weight:800;font-size:16px;cursor:pointer;width:100%;}
select{padding:8px;border-radius:8px;border:1px solid #ccc;margin-left:auto;}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><div class="brandmark">M</div> Mark2PDF</div>
  <select onchange="changeLang(this.value)"><option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option><option value="es">🇪🇸 ES</option><option value="pt">🇧🇷 PT</option></select>
</div>
<div class="container">
  <h1 id="t_title">Convertissez votre Markdown en PDF</h1>
  <textarea id="mdInput" placeholder="# Titre&#10;Voici mon texte en **gras**."></textarea>
  <button class="primary" id="btnGen" onclick="convert()">Générer le PDF</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
const dict = {
  fr: { title: "Convertissez votre Markdown en PDF", btn: "Générer le PDF" },
  en: { title: "Convert your Markdown to PDF", btn: "Generate PDF" },
  es: { title: "Convierte tu Markdown a PDF", btn: "Generar PDF" },
  pt: { title: "Converta seu Markdown para PDF", btn: "Gerar PDF" }
};
let currentLang = 'fr';
window.changeLang = (l) => { currentLang = l; const t = dict[l]; document.getElementById('t_title').textContent = t.title; document.getElementById('btnGen').textContent = t.btn; };
window.convert = async () => {
  const { PDFDocument, StandardFonts } = PDFLib;
  const doc = await PDFDocument.create(), font = await doc.embedFont(StandardFonts.Helvetica);
  const page = doc.addPage([595, 842]), { height } = page.getSize(); let y = height - 50;
  const text = document.getElementById('mdInput').value;
  const lines = text.split('\n');
  lines.forEach(line => {
    if (line.startsWith('# ')) page.drawText(line.substring(2), { x: 50, y, size: 20, font });
    else page.drawText(line, { x: 50, y, size: 12, font });
    y -= 20;
  });
  const bytes = await doc.save(); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' })); a.download = 'document.pdf'; a.click();
};
changeLang('fr');
</script>
</body>
</html>
